# cibuildwheel configuration
[tool.cibuildwheel]
build-verbosity = 3
test-requires = ["pytest", "pytest-cov", "numpy>=1.20.0"]
test-command = "python -I {project}/scripts/test_wheel_import.py && pytest {project}/tests --cov=py_dem_bones --cov-report=term --cov-report=xml -v"

# Common configuration for all platforms
environment-pass = [
    # Pass through ccache environment variables
    "CCACHE_DIR",
    "CCACHE_MAXSIZE",
    "CCACHE_SLOPPINESS",
    "CCACHE_COMPRESS",
    "CCACHE_COMPILERCHECK",
    "CCACHE_NOHASHDIR",
    "CCACHE_BASEDIR",
]

# Common environment variables for all platforms
# The package version is stored in pyproject.toml and updated by release-please.
environment = {}

# Windows-specific configuration
[tool.cibuildwheel.windows]
# Use Ninja generator to speed up builds

# Install Ninja, ccache and other tools
before-all = [
    "pip install ninja delvewheel wheel",
    "choco install -y ccache",
    "ccache --version",
    "ccache -p",  # Print ccache configuration
    "ccache -z"   # Zero statistics
]
# Avoid updating pip itself, which can cause errors
before-build = [
    "pip install setuptools wheel numpy pybind11 scikit-build-core cmake",
    "ccache -s"   # Print ccache statistics before build
]
# Use delvewheel to repair wheel packages
repair-wheel-command = "delvewheel repair -w {dest_dir} {wheel}"

[tool.cibuildwheel.windows.environment]
CMAKE_GENERATOR = "Ninja"
CMAKE_POSITION_INDEPENDENT_CODE = "ON"
# Ensure DLLs can be loaded correctly
PYTHONIOENCODING = "UTF-8"
PIP_NO_BUILD_ISOLATION = "1"
# Export the extension entry point; delvewheel repairs runtime dependencies.
CMAKE_WINDOWS_EXPORT_ALL_SYMBOLS = "ON"
# Disable loading DLLs from PATH to avoid conflicts
PYDEMB_PYTHON_LOAD_DLLS_FROM_PATH = "0"
# Enable ccache with optimized settings
CCACHE_MAXSIZE = "5G"
CCACHE_SLOPPINESS = "pch_defines,time_macros,include_file_mtime,include_file_ctime,file_stat_matches"
CCACHE_COMPRESS = "1"
CCACHE_COMPILERCHECK = "content"
CCACHE_NOHASHDIR = "1"
# Windows CI invokes the selected compiler directly; no ccache base is needed.
CCACHE_BASEDIR = ""
# Use parallel compilation
CMAKE_BUILD_PARALLEL_LEVEL = "4"

# Linux-specific configuration
[tool.cibuildwheel.linux]

before-all = [
    "yum install -y ccache || apt-get update && apt-get install -y ccache || true",
    "ccache --version || echo 'ccache not found'",
    "ccache -p || echo 'ccache not configured'",  # Print ccache configuration
    "ccache -z || echo 'ccache zero failed'"      # Zero statistics
]
before-build = [
    "pip install -U pip setuptools wheel numpy pybind11 scikit-build-core cmake",
    "ccache -s || echo 'ccache stats failed'"     # Print ccache statistics before build
]
repair-wheel-command = "auditwheel repair -w {dest_dir} {wheel}"

[tool.cibuildwheel.linux.environment]
# Cap NumPy to a manylinux2014 wheel instead of compiling it with the older GCC.
# cibuildwheel copies the project, including this constraint file, to /project.
PIP_CONSTRAINT = "/project/constraints-manylinux2014.txt"
LANG = "C.UTF-8"
LC_ALL = "C.UTF-8"
PYTHONIOENCODING = "UTF-8"
# Enable ccache with optimized settings
CCACHE_MAXSIZE = "5G"
CCACHE_SLOPPINESS = "pch_defines,time_macros,include_file_mtime,include_file_ctime,file_stat_matches"
CCACHE_COMPRESS = "1"
CCACHE_COMPILERCHECK = "content"
CCACHE_NOHASHDIR = "1"
# Environment values do not expand command placeholders such as {package}.
CCACHE_BASEDIR = "/project"
# Use parallel compilation
CMAKE_BUILD_PARALLEL_LEVEL = "4"

# macOS-specific configuration
[tool.cibuildwheel.macos]

before-all = [
    "brew install ccache || true",
    "ccache --version",
    "ccache -p",  # Print ccache configuration
    "ccache -z"   # Zero statistics
]
before-build = [
    "pip install -U pip setuptools wheel numpy pybind11 scikit-build-core cmake",
    "ccache -s"   # Print ccache statistics before build
]
repair-wheel-command = "delocate-wheel --require-archs {delocate_archs} -w {dest_dir} -v {wheel}"

[tool.cibuildwheel.macos.environment]
# AppleClang has no bundled OpenMP runtime; wheel jobs explicitly use serial.
CMAKE_ARGS = "-DPY_DEM_BONES_USE_OPENMP=OFF"
# Enable ccache with optimized settings
CCACHE_MAXSIZE = "5G"
CCACHE_SLOPPINESS = "pch_defines,time_macros,include_file_mtime,include_file_ctime,file_stat_matches"
CCACHE_COMPRESS = "1"
CCACHE_CPP2 = "yes"
CCACHE_COMPILERCHECK = "content"
CCACHE_NOHASHDIR = "1"
CCACHE_BASEDIR = "$PWD"
# Use parallel compilation
CMAKE_BUILD_PARALLEL_LEVEL = "4"
