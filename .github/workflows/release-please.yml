name: Release Please

# Conventional commits drive the version: a push to main updates the
# "chore: release vX.Y.Z" PR, and merging it creates the tag + GitHub Release.
# The existing release/publish workflow then reacts to that tag.
#
# This repo ships more than a pure wheel (native binaries / platform archives),
# so release-please stays in its own workflow and keeps the build matrix that
# already works. The tag has to be created with a PAT for that to fire: GitHub
# never starts a workflow from a tag created with the default GITHUB_TOKEN.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-please-main
  cancel-in-progress: false

jobs:
  # ── Guard: only ask release-please for a release when there is something ───
  # to release. release-please treats every commit on main as release input, so
  # a workflow that re-generates files on the branch (lock sync, formatting)
  # would otherwise keep the release PR alive on chore/ci/docs commits alone.
  preflight:
    runs-on: ubuntu-latest
    outputs:
      releasable: ${{ steps.check.outputs.releasable }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check for releasable commits since the last release tag
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          # A manual run is always allowed to proceed.
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "workflow_dispatch: skipping the releasable-commit gate"
            echo "releasable=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Only feat/fix/perf/refactor/revert and BREAKING CHANGE: move the
          # version here; chore/ci/docs/test/style/build are release-neutral.
          # The script fails open, so a broken range never suppresses a release.
          python3 - <<'PY'
          """Decide whether a commit window contains something worth releasing.

          The release workflow uses this to keep release-please from cutting a release
          for commits that do not move the product. release-please's own rule is blunt:
          in ``determineReleaseType`` anything that is neither breaking nor a ``feat``
          falls through to a patch bump, so a ``docs:`` or ``chore:`` commit alone is
          enough to produce a release. That matters here because any automation that
          regenerates files on the release branch would otherwise keep the release PR
          alive.

          The gate deliberately fails open: if the git range cannot be resolved the
          script reports ``releasable=true`` so a release is never silently suppressed.

          Input and output go through the environment (``GITHUB_OUTPUT``) rather than
          argv so the body can be inlined into a workflow step unchanged.
          """

          # Import built-in modules
          import os
          import re
          import subprocess
          import sys
          from pathlib import Path

          # Only these conventional-commit types are treated as release-worthy. A
          # ``BREAKING CHANGE:`` footer counts too, whatever the type of the commit.
          RELEASABLE_PATTERN = re.compile(
              r"^(feat|fix|perf|refactor|revert)(\([^)]*\))?!?:|^BREAKING CHANGE:",
              re.MULTILINE,
          )

          # Older releases used bare numeric tags; new releases use v-prefixed tags.
          TAG_PATTERNS = ("v[0-9]*", "[0-9]*")


          def git(*args):
              """Run git and return (returncode, stdout)."""
              result = subprocess.run(["git", *args], capture_output=True, text=True)
              return result.returncode, result.stdout


          def is_releasable(commit_text):
              """Return True when a commit window contains at least one release-worthy commit.

              ``commit_text`` is the concatenated ``%s%n%b`` (subject plus body) of every
              commit in the window.
              """
              return bool(RELEASABLE_PATTERN.search(commit_text or ""))


          def last_release_tag():
              """Return the nearest release tag reachable from HEAD, or None."""
              code, out = git(
                  "describe", "--tags", "--abbrev=0",
                  *(arg for pattern in TAG_PATTERNS for arg in ("--match", pattern)),
              )
              if code != 0:
                  return None
              return out.strip() or None


          def commit_window(range_spec):
              """Return the combined subjects and bodies of the commits in a git range."""
              code, out = git("log", "--no-merges", "--format=%s%n%b", range_spec)
              if code != 0:
                  raise RuntimeError(f"git log failed for range {range_spec!r}")
              return out


          def resolve_range():
              """Return a git range covering everything since the last release tag."""
              tag = last_release_tag()
              return f"{tag}..HEAD" if tag else "HEAD"


          def decide(range_spec=None):
              """Return True when the window should be released.

              With no explicit range the window is everything since the last ``v*`` tag,
              or the whole history when the repo has no release tag yet.
              """
              return is_releasable(commit_window(range_spec or resolve_range()))


          def emit(releasable):
              """Print the result and append it to $GITHUB_OUTPUT when one is set."""
              line = f"releasable={str(releasable).lower()}"
              print(line)
              output = os.environ.get("GITHUB_OUTPUT")
              if output:
                  with Path(output).open("a", encoding="utf-8") as handle:
                      handle.write(f"{line}\n")


          def main():
              """Return 0 always: this gate must never fail the workflow it guards."""
              try:
                  releasable = decide()
              except (OSError, RuntimeError, ValueError) as error:
                  # Fail open, but say why.
                  print(f"::error::{error}")
                  print("Failing open: treating the window as releasable")
                  releasable = True
              emit(releasable)
              return 0


          if __name__ == "__main__":
              sys.exit(main())
          PY

  release-please:
    needs: [preflight]
    if: needs.preflight.outputs.releasable == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # tag + GitHub Release
      pull-requests: write # the release PR itself
      actions: write # hand the tag to release.yml when a push event cannot fire
    steps:
      # A configured secret is not necessarily a working one. PERSONAL_ACCESS_TOKEN
      # is set on this repository but no longer authenticates, and because the
      # expression language only sees a non-empty string, the usual
      # `secrets.A || secrets.B` chain short-circuits onto the dead token and
      # release-please answers "Bad credentials". Verify each candidate against a
      # cheap authenticated call and let the first usable one win, rather than
      # trusting that a set secret is a usable secret.
      - name: Resolve release-please credentials
        id: credentials
        env:
          RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          REPOSITORY_API: ${{ github.api_url }}/repos/${{ github.repository }}
        run: |
          set -euo pipefail

          probe_err="$RUNNER_TEMP/rp-probe.err"

          usable() {
            GH_TOKEN="$1" gh api "$REPOSITORY_API" --silent 2>"$probe_err"
          }

          report_unusable() {
            # gh keeps credential values out of its error output, so the message
            # it produced is safe to surface.
            echo "::warning::$1 is configured but could not authenticate: $(head -n 1 "$probe_err")"
            rm -f "$probe_err"
          }

          use_pat=false
          for name in RELEASE_PLEASE_TOKEN PERSONAL_ACCESS_TOKEN; do
            token="${!name}"
            [ -n "$token" ] || continue
            if usable "$token"; then
              echo "source=$name" >> "$GITHUB_OUTPUT"
              echo "pat=true" >> "$GITHUB_OUTPUT"
              use_pat=true
              break
            fi
            report_unusable "$name"
          done

          if [ "$use_pat" = "false" ]; then
            echo "source=GITHUB_TOKEN" >> "$GITHUB_OUTPUT"
            echo "pat=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No usable PAT secret; falling back to GITHUB_TOKEN. A tag created with GITHUB_TOKEN raises no push event, so release.yml is dispatched explicitly below."
          fi

      - uses: googleapis/release-please-action@v5
        id: release
        with:
          # A usable PAT stays the preferred credential: it makes the release PR
          # carry CI status and lets the tag it pushes fire release.yml directly.
          # GITHUB_TOKEN keeps the release PR flowing when no working PAT exists,
          # instead of failing the whole run on a dead secret.
          token: ${{ steps.credentials.outputs.pat == 'true' && (secrets.RELEASE_PLEASE_TOKEN || secrets.PERSONAL_ACCESS_TOKEN) || secrets.GITHUB_TOKEN }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # A tag created with GITHUB_TOKEN never raises `on: push: tags:`, which is
      # the only publication trigger release.yml had. workflow_dispatch is the
      # one event GitHub does start from a GITHUB_TOKEN-initiated request, so
      # start the publish chain by hand. Skipped when a PAT was used, because
      # that tag push already triggers release.yml on its own.
      - name: Start the release workflow for a GITHUB_TOKEN-created tag
        if: >-
          steps.credentials.outputs.pat == 'false' &&
          (steps.release.outputs.release_created == 'true' ||
           steps.release.outputs.releases_created == 'true')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          set -euo pipefail
          if [ -z "$RELEASE_TAG" ]; then
            echo "::error::release-please reported a release without a tag name"
            exit 1
          fi
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$RELEASE_TAG"
          echo "Dispatched release.yml for tag $RELEASE_TAG"
