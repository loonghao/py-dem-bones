name: Build and Release

on:
  # Package publication is triggered only by a release-please tag.
  # Pull requests and manual dispatch build without publishing.
  push:
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/*.md'
      - '.github/ISSUE_TEMPLATE/**'
      - 'LICENSE*'
      - '.readthedocs.yml'
      - 'CITATION.cff'
      - 'CODE_OF_CONDUCT.md'
      - 'CONTRIBUTING.md'
      - '**.rst'
      - '.hound.yml'
      - '.gitignore'
      - '.gitmodules'
      - '.coveragerc'
      - 'codecov.yml'
      - '.flake8'
      - '.pylintrc'
      - 'renovate.json'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/*.md'
      - '.github/ISSUE_TEMPLATE/**'
      - 'LICENSE*'
      - '.readthedocs.yml'
      - 'CITATION.cff'
      - 'CODE_OF_CONDUCT.md'
      - 'CONTRIBUTING.md'
      - '**.rst'
      - '.hound.yml'
      - '.gitignore'
      - '.gitmodules'
      - '.coveragerc'
      - 'codecov.yml'
      - '.flake8'
      - '.pylintrc'
      - 'renovate.json'
  workflow_dispatch:
    inputs:
      fast-mode:
        description: 'Fast mode (reduced build variants)'
        required: false
        default: 'false'
        type: choice
        options: ['true', 'false']
      test-wheels:
        description: 'Test wheels compatibility'
        required: false
        default: 'false'
        type: choice
        options: ['true', 'false']
# Permissions needed for this workflow
permissions:
  contents: write    # For creating releases and pushing to gh-pages
  pull-requests: write  # For commenting on PRs
  pages: write      # For GitHub Pages deployment
  id-token: write   # For PyPI trusted publishing

# Concurrency control
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Global variables
env:
  # Common settings
  CIBW_CONFIG_FILE: "{package}/.cibuildwheel.toml"
  CIBW_BUILD_VERBOSITY: 3
  CCACHE_MAX_SIZE: 2G

jobs:
  # Build source distribution
  build-sdist:
    name: Build source distribution
    if: ${{ !(github.event_name == 'workflow_dispatch' && github.event.inputs.fast-mode == 'true') && (github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'release' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: ./.github/actions/setup-python-build
        with:
          python-version: '3.10'

      # Install system dependencies
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc g++
        shell: bash

      # Set up ccache
      - uses: ./.github/actions/setup-ccache
        with:
          platform: sdist
          python: cp310
          max-size: ${{ env.CCACHE_MAX_SIZE }}

      - name: Install dependencies
        run: python -m pip install build numpy pybind11 scikit-build-core cmake tomli

      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import tomli

          version = tomli.loads(Path('pyproject.toml').read_text())['project']['version']
          tag = os.environ['GITHUB_REF_NAME']
          if tag != f'v{version}':
              raise SystemExit(f'tag {tag!r} does not match package version {version!r}')
          PY

      - name: Build SDist
        run: |
          # Build the source distribution
          python -m build --sdist

      # PyPI rejects any file above the per-project limit (100 MB by default),
      # and the rejection lands at the very end of the publish job after every
      # wheel has already been uploaded. Catch an oversized sdist here instead,
      # before the wheels are built.
      - name: Check SDist size against the PyPI project limit
        shell: bash
        run: |
          python - <<'PY'
          """Fail fast when the sdist is too large for PyPI to accept."""
          # Import built-in modules
          import sys
          from pathlib import Path

          # PyPI's default per-project file size limit; raise it in lockstep if
          # PyPI ever grants this project a larger quota.
          LIMIT_BYTES = 100 * 1024 * 1024

          # Import third-party modules
          sdists = sorted(Path("dist").glob("*.tar.gz"))
          if not sdists:
              sys.exit("No sdist was built; expected one *.tar.gz under dist/")

          for path in sdists:
              size = path.stat().st_size
              print(f"{path.name}: {size / 1e6:.1f} MB")
              if size > LIMIT_BYTES:
                  sys.exit(
                      f"{path.name} is {size / 1e6:.1f} MB, above PyPI's "
                      f"{LIMIT_BYTES / 1e6:.0f} MB project limit"
                  )
          PY

      - name: Verify SDist
        run: |
          python -m pip install --upgrade pip
          python -m pip install dist/*.tar.gz
          python -c "import py_dem_bones; print(f'Installed py_dem_bones version: {py_dem_bones.__version__}, dem_bones version: {py_dem_bones.__dem_bones_version__}')"

      # Test the installed source distribution before release publication too.
      - name: Test SDist
        run: |
          python -m pip install pytest pytest-cov numpy
          python -m pytest tests --cov=py_dem_bones --cov-report=term --cov-report=xml -v

      # Only upload coverage in PR context
      - name: Upload coverage reports to Codecov
        if: github.event_name == 'pull_request'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false
          verbose: true

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  # Build and test wheels for Linux
  build-wheels-linux:
    name: Build ${{ matrix.python }} wheels on Linux
    if: ${{ !(github.event_name == 'workflow_dispatch' && github.event.inputs.fast-mode == 'true') && (github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'release' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        python: [cp38, cp39, cp310, cp311, cp312]
        include:
          - python: cp38
            python-version: '3.8'
          - python: cp39
            python-version: '3.9'
          - python: cp310
            python-version: '3.10'
          - python: cp311
            python-version: '3.11'
          - python: cp312
            python-version: '3.12'

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # Cache Eigen library
      - uses: ./.github/actions/cache-eigen
        with:
          platform: Linux

      # Set up ccache
      - uses: ./.github/actions/setup-ccache
        with:
          platform: Linux
          python: ${{ matrix.python }}
          max-size: ${{ env.CCACHE_MAX_SIZE }}

      # Build wheels using cibuildwheel action
      - uses: ./.github/actions/build-wheels
        with:
          platform: linux
          python: ${{ matrix.python }}
          config-file: ${{ env.CIBW_CONFIG_FILE }}
          build-verbosity: ${{ env.CIBW_BUILD_VERBOSITY }}

      # Upload wheels
      - uses: ./.github/actions/upload-wheels
        with:
          platform: linux
          python: ${{ matrix.python }}

      # Test the wheel immediately after building
      - uses: ./.github/actions/setup-python-build
        with:
          python-version: ${{ matrix.python-version }}

      - uses: ./.github/actions/test-wheel
        with:
          platform: linux

  # Build and test wheels for Windows
  build-wheels-windows:
    name: Build ${{ matrix.python }} wheels on Windows
    if: ${{ !(github.event_name == 'workflow_dispatch' && github.event.inputs.fast-mode == 'true') && (github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'release' || github.event_name == 'workflow_dispatch') }}
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        python: [cp38, cp39, cp310, cp311, cp312]
        include:
          - python: cp38
            python-version: '3.8'
          - python: cp39
            python-version: '3.9'
          - python: cp310
            python-version: '3.10'
          - python: cp311
            python-version: '3.11'
          - python: cp312
            python-version: '3.12'

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # Build with the exact msvc-kit compiler and SDK for this Python ABI.
      - uses: ./.github/actions/build-wheels
        with:
          platform: windows
          python: ${{ matrix.python }}
          python-version: ${{ matrix.python-version }}
          config-file: ${{ env.CIBW_CONFIG_FILE }}
          build-verbosity: ${{ env.CIBW_BUILD_VERBOSITY }}

      # Upload wheels
      - uses: ./.github/actions/upload-wheels
        with:
          platform: windows
          python: ${{ matrix.python }}

      # The selected Windows builder tests the repaired wheel in a clean venv.

  build-wheels-windows-arm64:
    name: Build ${{ matrix.python }} wheels on Windows ARM64
    if: ${{ !(github.event_name == 'workflow_dispatch' && github.event.inputs.fast-mode == 'true') }}
    runs-on: windows-11-arm
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: cp311
            python-version: '3.11'
          - python: cp312
            python-version: '3.12'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: ./.github/actions/build-windows-wheel
        with:
          python-version: ${{ matrix.python-version }}
          arch: arm64
      - uses: ./.github/actions/upload-wheels
        with:
          platform: windows-arm64
          python: ${{ matrix.python }}

  # Build and test wheels for macOS Intel
  build-wheels-macos:
    name: Build ${{ matrix.python }} wheels on macOS Intel
    if: ${{ !(github.event_name == 'workflow_dispatch' && github.event.inputs.fast-mode == 'true') && (github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'release' || github.event_name == 'workflow_dispatch') }}
    # The macos-13 label no longer provides runners, so the job used to sit in the
    # queue until GitHub cancelled it 24h later. macos-15-intel is the current
    # Intel (x86_64) hosted runner.
    runs-on: macos-15-intel
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        python: [cp38, cp39, cp310, cp311, cp312]
        include:
          - python: cp38
            python-version: '3.8'
          - python: cp39
            python-version: '3.9'
          - python: cp310
            python-version: '3.10'
          - python: cp311
            python-version: '3.11'
          - python: cp312
            python-version: '3.12'

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # Cache Eigen library
      - uses: ./.github/actions/cache-eigen
        with:
          platform: macOS-Intel

      # Set up ccache
      - uses: ./.github/actions/setup-ccache
        with:
          platform: macOS-Intel
          python: ${{ matrix.python }}
          max-size: ${{ env.CCACHE_MAX_SIZE }}

      # Build wheels using cibuildwheel action
      - uses: ./.github/actions/build-wheels
        with:
          platform: macos-intel
          python: ${{ matrix.python }}
          config-file: ${{ env.CIBW_CONFIG_FILE }}
          build-verbosity: ${{ env.CIBW_BUILD_VERBOSITY }}

      # Upload wheels
      - uses: ./.github/actions/upload-wheels
        with:
          platform: macos-intel
          python: ${{ matrix.python }}

      # Test the wheel immediately after building
      - uses: ./.github/actions/setup-python-build
        with:
          python-version: ${{ matrix.python-version }}

      - uses: ./.github/actions/test-wheel
        with:
          platform: macos

  # Build and test wheels for macOS Apple Silicon
  build-wheels-macos-arm:
    name: Build ${{ matrix.python }} wheels on macOS ARM
    if: ${{ !(github.event_name == 'workflow_dispatch' && github.event.inputs.fast-mode == 'true') && (github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'release' || github.event_name == 'workflow_dispatch') }}
    runs-on: macos-14
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        python: [cp39, cp310, cp311, cp312]
        # Note: cp38 is excluded as it's not available on macOS ARM
        include:
          - python: cp39
            python-version: '3.9'
          - python: cp310
            python-version: '3.10'
          - python: cp311
            python-version: '3.11'
          - python: cp312
            python-version: '3.12'

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # Cache Eigen library
      - uses: ./.github/actions/cache-eigen
        with:
          platform: macOS-ARM

      # Set up ccache
      - uses: ./.github/actions/setup-ccache
        with:
          platform: macOS-ARM
          python: ${{ matrix.python }}
          max-size: ${{ env.CCACHE_MAX_SIZE }}

      # Build wheels using cibuildwheel action
      - uses: ./.github/actions/build-wheels
        with:
          platform: macos-arm
          python: ${{ matrix.python }}
          config-file: ${{ env.CIBW_CONFIG_FILE }}
          build-verbosity: ${{ env.CIBW_BUILD_VERBOSITY }}

      # Upload wheels
      - uses: ./.github/actions/upload-wheels
        with:
          platform: macos-arm
          python: ${{ matrix.python }}

      # Test the wheel immediately after building
      - uses: ./.github/actions/setup-python-build
        with:
          python-version: ${{ matrix.python-version }}

      - uses: ./.github/actions/test-wheel
        with:
          platform: macos

  # Create GitHub Release and publish to PyPI
  release:
    name: Release
    needs: [build-wheels-linux, build-wheels-windows, build-wheels-windows-arm64, build-wheels-macos, build-wheels-macos-arm, build-sdist]
    # `workflow_dispatch` covers release-please tags minted with GITHUB_TOKEN:
    # GitHub raises no `push` event for those, and workflow_dispatch is the one
    # event it does start from a GITHUB_TOKEN-initiated request.
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    environment:
      name: release
      url: https://pypi.org/p/py-dem-bones
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Attach packages to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Publish to PyPI
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
