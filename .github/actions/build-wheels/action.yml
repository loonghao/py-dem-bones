name: 'Build Wheels'
description: 'Builds Python wheels using cibuildwheel'

inputs:
  platform:
    description: 'Platform (linux, windows, macos-intel, macos-arm)'
    required: true
    default: 'linux'
  python:
    description: 'Python version (cp38, cp39, etc.)'
    required: true
    default: 'cp310'
  python-version:
    description: Native CPython version for Windows
    default: '3.10'
  output-dir:
    description: 'Output directory for wheels'
    required: false
    default: 'wheelhouse'
  config-file:
    description: 'cibuildwheel config file'
    required: false
    default: '{package}/.cibuildwheel.toml'
  build-verbosity:
    description: 'cibuildwheel build verbosity'
    required: false
    default: '3'

runs:
  using: "composite"
  steps:
    - name: Check Windows interpreter selection
      if: inputs.platform == 'windows'
      shell: pwsh
      env:
        WHEEL_SELECTOR: ${{ inputs.python }}
        PYTHON_VERSION: ${{ inputs.python-version }}
      run: |
        $expected = 'cp' + $env:PYTHON_VERSION.Replace('.', '')
        if ($env:WHEEL_SELECTOR -ne $expected) { throw 'Windows wheel selector must match its Python version' }
    - name: Build Windows wheel with selected portable tools
      if: inputs.platform == 'windows'
      uses: ./.github/actions/build-windows-wheel
      with:
        python-version: ${{ inputs.python-version }}
        arch: x64
        output-dir: ${{ inputs.output-dir }}
    - name: Build wheels
      if: inputs.platform != 'windows'
      uses: pypa/cibuildwheel@v2.23.1
      with:
        output-dir: ${{ inputs.output-dir }}
        config-file: ${{ inputs.config-file }}
      env:
        # Platform-specific settings
        CIBW_BUILD: >-
          ${{ inputs.python }}-${{
            inputs.platform == 'linux' && 'manylinux*' ||
            inputs.platform == 'windows' && 'win*' ||
            inputs.platform == 'macos-intel' && 'macosx_x86_64' ||
            inputs.platform == 'macos-arm' && 'macosx_arm64'
          }}
        # Skip PyPy and other platforms
        CIBW_SKIP: >-
          pp* ${{
            inputs.platform == 'linux' && '*-musllinux* *-manylinux_i686' ||
            inputs.platform == 'windows' && '*-win32' ||
            ''
          }}
        # Set build verbosity
        CIBW_BUILD_VERBOSITY: ${{ inputs.build-verbosity }}
