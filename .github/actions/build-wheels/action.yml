name: 'Build Wheels'
description: 'Builds Python wheels using cibuildwheel'

inputs:
  platform:
    description: 'Platform (linux, windows, macos-intel, macos-arm)'
    required: true
    default: 'linux'
  python:
    description: 'Python version (cp38, cp39, etc.)'
    required: true
    default: 'cp310'
  output-dir:
    description: 'Output directory for wheels'
    required: false
    default: 'wheelhouse'
  config-file:
    description: 'cibuildwheel config file'
    required: false
    default: '{package}/.cibuildwheel.toml'
  build-verbosity:
    description: 'cibuildwheel build verbosity'
    required: false
    default: '3'

runs:
  using: "composite"
  steps:
    - name: Build wheels
      uses: pypa/cibuildwheel@v2.23.1
      with:
        output-dir: ${{ inputs.output-dir }}
        config-file: ${{ inputs.config-file }}
      env:
        # Platform-specific settings
        CIBW_BUILD: >-
          ${{ inputs.python }}-${{
            inputs.platform == 'linux' && 'manylinux*' ||
            inputs.platform == 'windows' && 'win*' ||
            inputs.platform == 'macos-intel' && 'macosx_x86_64' ||
            inputs.platform == 'macos-arm' && 'macosx_arm64'
          }}
        # Skip PyPy and other platforms
        CIBW_SKIP: >-
          pp* ${{
            inputs.platform == 'linux' && '*-musllinux* *-manylinux_i686' ||
            inputs.platform == 'windows' && '*-win32' ||
            ''
          }}
        # Set build verbosity
        CIBW_BUILD_VERBOSITY: ${{ inputs.build-verbosity }}
        # Install the wheel repair tool and the Ninja generator. The trailing Visual
        # Studio `dir` probes that used to live here were pure diagnostics and made
        # the whole command exit non-zero on runner images without VS2019/VS2022,
        # which failed every Windows wheel job before the build even started.
        CIBW_BEFORE_ALL_WINDOWS: >-
          ${{ inputs.platform == 'windows' && 'pip install delvewheel && choco install -y ninja' || '' }}
